// Local Expo module, autolinked from `apps/mobile/modules` like list-shortcuts.
// The SDK versions come from expo-module-gradle-plugin, which reads the app's
// own compileSdk/minSdk/targetSdk.
//
// The plugin requires `versionCode` and `versionName` and fails configuration
// without them ("'android.defaultConfig.versionName' is not defined"), which is
// why they are set here even though nothing reads them.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dodonewear'
version = '0.1.0'

android {
  namespace 'expo.modules.dodonewear'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The Data Layer. The watch app declares the same dependency; the two talk
  // over paths declared once in WearContract.kt and mirrored in the watch
  // module — plugins/withWearApp.test.ts asserts the two copies agree.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'

  // HeadlessJsTaskService, HeadlessJsTaskConfig and Arguments, which the two
  // sync services are built on. The expo module plugin does not put React
  // Native on the compile classpath by itself. No version: the React Native
  // Gradle plugin pins react-android for every project, as it does for
  // expo-modules-core.
  implementation 'com.facebook.react:react-android'
}
