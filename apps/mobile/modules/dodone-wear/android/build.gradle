apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.dodonewear'
version = '0.1.0'

android {
  namespace 'expo.modules.dodonewear'
  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
  }
}

dependencies {
  // The Data Layer. The watch app declares the same dependency; the two talk
  // over paths declared once in WearContract.kt and mirrored in the watch
  // module — plugins/withWearApp.test.ts asserts the two copies agree.
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
