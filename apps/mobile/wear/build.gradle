apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

/**
 * The watch app.
 *
 * `applicationId` matches the phone app deliberately. Play pairs a Wear OS APK
 * to its phone app by package name, and the Data Layer only connects nodes that
 * share one — two ids would give a watch app that installs and then never sees a
 * snapshot, with nothing reporting why.
 *
 * The versions below were resolved and built against Expo 54's AGP 8.11 and
 * Kotlin 2.1.20. They are from the same release era on purpose: a newer
 * AndroidX release can be compiled with a Kotlin this project's compiler cannot
 * read, so move them together. CI has no Android SDK and does not build this;
 * see docs/wear-os-verification.md.
 */
android {
  namespace 'com.beamer408.dodone.wear'
  compileSdk safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    applicationId 'com.beamer408.dodone'
    // Wear OS 3 is the floor. Below it there is no Tiles API, no Compose for
    // Wear OS, and no watch worth shipping to.
    minSdkVersion 30
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    versionCode 1
    versionName '1.0.0'
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  // The watch app must be signed with the same key as the phone app. The Data
  // Layer only connects apps that share a package name *and* a signing key, so
  // a mismatch installs fine and then never receives a snapshot.
  //
  // Without this block Gradle signs with its own `~/.android/debug.keystore`,
  // which is a different key from the `android/app/debug.keystore` the phone
  // app uses. On EAS, the release key is applied at the bottom of this file.
  signingConfigs {
    debug {
      storeFile file('../app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // Replaced by the EAS release key on EAS builds (see below). A local
      // release build uses the debug key, the same as the phone app's does.
      signingConfig signingConfigs.debug
    }
  }

  packagingOptions {
    resources {
      excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "androidx.activity:activity-compose:1.10.1"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"

  // Compose for Wear OS. Material3 rather than the older Material: it is what
  // the platform's own apps draw now, and its list and button shapes are the
  // ones a round screen is laid out for.
  implementation "androidx.compose.ui:ui:1.9.5"
  implementation "androidx.compose.ui:ui-tooling-preview:1.9.5"
  debugImplementation "androidx.compose.ui:ui-tooling:1.9.5"
  implementation "androidx.wear.compose:compose-material3:1.5.6"
  implementation "androidx.wear.compose:compose-foundation:1.5.6"
  implementation "androidx.wear.compose:compose-navigation:1.5.6"

  // Wear's own input picker — voice, keyboard and handwriting behind one
  // intent. Reaching straight for RecognizerIntent would offer voice alone, and
  // a name that will not dictate ("Ikea", a colleague's surname) would have
  // nowhere to go.
  implementation "androidx.wear:wear-input:1.1.0"

  // The Data Layer — how the snapshot arrives.
  implementation "com.google.android.gms:play-services-wearable:19.0.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

  // Tiles and complications.
  implementation "androidx.wear.tiles:tiles:1.5.0"
  implementation "androidx.wear.protolayout:protolayout:1.3.0"
  implementation "androidx.wear.protolayout:protolayout-material:1.3.0"
  implementation "androidx.wear.protolayout:protolayout-expression:1.3.0"
  implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"

  // `Futures.immediateFuture`, which every TileService returns. The
  // `listenablefuture` stub that arrives transitively carries the interface and
  // none of the helpers, so leaving this out fails to resolve `Futures` alone —
  // a confusing error, since the type it operates on resolves fine.
  implementation "com.google.guava:guava:33.3.1-android"

  // JVM tests for the pure rules in data/ (see src/test). They need an SDK to
  // run, which CI does not have, so they run wherever the watch app is built.
  testImplementation "junit:junit:4.13.2"

  // Deliberately no HTTP client and no JSON library. `HttpURLConnection` and
  // `org.json` are in the platform, the watch makes three kinds of request, and
  // every dependency here is one more thing to resolve in a build nothing in
  // this repo can run.
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// On EAS, sign with the phone app's release key.
//
// EAS writes its signing script into `android/app/` and applies it from the
// phone app's build.gradle only, so this module does not get it on its own
// (checked in @expo/build-tools 24.9.0). The script reads the keystore from
// EAS's credentials.json and sets it on every build type of whichever module
// applies it. The file exists only on an EAS build machine.
def easCredentials = file('../app/eas-build-inject-android-credentials.gradle')
if (easCredentials.exists()) {
  apply from: easCredentials
}
