name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full history for baselines

      # pnpm version comes from package.json `packageManager` — don't
      # also pass `version:` here or pnpm/action-setup will refuse with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (shared, api-client, task-engine)
        run: pnpm build --filter=@do-done/shared --filter=@do-done/api-client --filter=@do-done/task-engine --filter=@do-done/ui

      - name: Run Chromatic
        # v16 matches the chromatic@^16.6.0 dep in apps/web/package.json.
        # v11 (previously pinned) triggers an "outdated CLI" warning in
        # the Chromatic UI on every build.
        uses: chromaui/action@v16
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          buildScriptName: build-storybook
          onlyChanged: true
          # TurboSnap traces the *bundled* module graph, and every @do-done/*
          # package is consumed as its built `dist/` output (their package.json
          # exports point there, and the build step above runs first). So a
          # change to `packages/shared/src/display.ts` matches nothing in the
          # graph — TurboSnap concluded "0 story files affected" and skipped
          # all 172 snapshots on a PR that visibly altered the Display menu.
          # Since UI Tests is a required check, that made the gate blind to
          # every regression originating in the design system or the shared
          # display engine. Listing the packages as externals forces a full
          # rebuild whenever they change, so the failure mode is "snapshot
          # more than needed" rather than "silently snapshot nothing".
          externals: |
            packages/**
          exitZeroOnChanges: true
          exitOnceUploaded: true
